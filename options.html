<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>代理链助手设置</title><link rel="stylesheet" href="options.css"></head><body><main class="glass"><header><div><span class="eyebrow">PROXY CHAIN ASSISTANT</span><h1>代理链助手设置</h1><p>连接你的 Mihomo / OpenClash External Controller</p></div><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></header><section class="card"><h2>控制器</h2><div class="grid"><label class="wide">控制器地址<input id="controller" type="url" placeholder="http://192.168.160.2:9090" autocomplete="off"></label><label class="wide">Secret（可选）<input id="secret" type="password" placeholder="不要填写 Bearer 前缀" autocomplete="off"></label><label>请求超时<input id="timeout" type="number" min="500" max="30000" step="100" value="3000"><small>毫秒</small></label><label>浮动位置<select id="overlaySide"><option value="right">右下角</option><option value="left">左下角</option></select></label></div><label class="switch"><input id="overlayEnabled" type="checkbox" checked><span></span>在网页显示国旗、代理链和延迟</label><div class="buttons"><button id="save">保存配置</button><button id="test" class="secondary">测试连接</button></div><p id="status"></p></section><section class="card compact"><h2>OpenClash 配置示例</h2><pre>external-controller: 0.0.0.0:9090
